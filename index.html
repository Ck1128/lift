<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Lift</title>
<meta name="description" content="A free, private Fitbod-style workout generator and tracker.">
<meta name="theme-color" content="#FF5A36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --accent:#FF5A36;
    --accent-dark:#E64A26;
    --bg:#F7F7F8;
    --card:#FFFFFF;
    --border:#E8E8EA;
    --text:#1A1A1A;
    --text-dim:#8A8A8E;
    --text-faint:#B4B4B8;
    --fresh-fg:#1E8E4F; --fresh-bg:#E7F7ED;
    --recovering-fg:#B8860B; --recovering-bg:#FDF4DD;
    --fatigued-fg:#D64545; --fatigued-bg:#FDECEC;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
  body{padding-bottom:calc(74px + env(safe-area-inset-bottom));}
  #app{max-width:520px;margin:0 auto;padding:20px 16px 8px;}
  h1.screen-title{font-size:30px;font-weight:800;margin:8px 2px 16px;letter-spacing:-0.02em;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
  .card-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);margin-bottom:10px;}
  .pill-row{display:flex;flex-wrap:wrap;gap:8px;}
  .pill{font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;white-space:nowrap;}
  .pill.fresh{color:var(--fresh-fg);background:var(--fresh-bg);}
  .pill.recovering{color:var(--recovering-fg);background:var(--recovering-bg);}
  .pill.fatigued{color:var(--fatigued-fg);background:var(--fatigued-bg);}
  .field{margin-bottom:16px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;}
  .select-wrap{position:relative;}
  .select-wrap select{width:100%;appearance:none;-webkit-appearance:none;background:var(--card);
    border:1px solid var(--border);border-radius:10px;padding:13px 36px 13px 14px;font-size:16px;
    color:var(--text);font-weight:500;}
  .select-wrap::after{content:"";position:absolute;right:14px;top:50%;transform:translateY(-65%);
    width:9px;height:9px;border-right:2px solid var(--text-faint);border-bottom:2px solid var(--text-faint);
    pointer-events:none;}
  button{font-family:inherit;}
  .btn{display:block;width:100%;text-align:center;padding:15px;border-radius:12px;border:none;
    font-size:16px;font-weight:700;cursor:pointer;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:disabled{background:#F1C9BE;color:#fff;cursor:default;}
  .btn-secondary{background:var(--bg);color:var(--text);border:1px solid var(--border);}
  .btn-ghost{background:none;color:var(--accent);padding:8px 10px;font-weight:700;font-size:14px;}
  .btn-danger-ghost{background:none;color:var(--fatigued-fg);font-weight:700;font-size:14px;padding:8px 10px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .muted{color:var(--text-dim);}
  .ex-card{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--card);}
  .ex-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .ex-name{font-size:17px;font-weight:700;margin:0 0 2px;}
  .ex-meta{font-size:12.5px;color:var(--text-dim);}
  .ex-actions{display:flex;gap:4px;flex-shrink:0;}
  .icon-btn{background:var(--bg);border:none;border-radius:8px;width:34px;height:34px;font-size:15px;
    color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .sets-table{margin-top:12px;}
  .set-row{display:grid;grid-template-columns:28px 1fr 1fr 40px;gap:8px;align-items:center;margin-bottom:8px;}
  .set-row.done{opacity:.55;}
  .set-num{font-size:13px;color:var(--text-dim);text-align:center;font-weight:600;}
  .set-row input{width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 8px;font-size:15px;
    text-align:center;background:var(--bg);color:var(--text);}
  .set-row input:disabled{color:var(--text-dim);background:#F0F0F1;}
  .check{width:36px;height:36px;border-radius:999px;border:2px solid var(--border);background:var(--card);
    display:flex;align-items:center;justify-content:center;font-size:16px;color:transparent;cursor:pointer;}
  .check.on{background:var(--fresh-fg);border-color:var(--fresh-fg);color:#fff;}
  .ex-detail{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
  .ex-detail img{width:100%;max-width:320px;display:block;border-radius:10px;margin:0 auto 10px;background:var(--bg);}
  .ex-detail ol{margin:0;padding-left:18px;font-size:14px;line-height:1.5;color:var(--text);}
  .ex-detail ol li{margin-bottom:6px;}
  .watch-link{display:inline-block;margin-top:8px;font-size:13.5px;font-weight:700;color:var(--accent);text-decoration:none;}
  .rest-banner{position:sticky;top:0;z-index:5;background:var(--text);color:#fff;border-radius:14px;
    padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
  .rest-banner .time{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;}
  .rest-banner .skip{background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:8px;
    padding:9px 14px;font-weight:700;font-size:13px;}
  .tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--border);
    display:flex;padding-bottom:env(safe-area-inset-bottom);}
  .tab{flex:1;text-align:center;padding:12px 4px 10px;border:none;background:none;font-size:11.5px;
    font-weight:700;color:var(--text-faint);cursor:pointer;}
  .tab .tab-icon{display:block;font-size:19px;margin-bottom:2px;}
  .tab.active{color:var(--accent);}
  .history-item{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--card);}
  .history-item .date{font-weight:700;font-size:15px;}
  .history-item .sub{font-size:13px;color:var(--text-dim);margin-top:2px;}
  .history-detail{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:13.5px;}
  .history-detail div{display:flex;justify-content:space-between;padding:3px 0;}
  .chart-card{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--card);}
  .chart-card .ch-title{font-size:14.5px;font-weight:700;margin-bottom:2px;}
  .chart-card .ch-sub{font-size:12px;color:var(--text-dim);margin-bottom:8px;}
  .equip-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
  .equip-chip{padding:8px 13px;border-radius:999px;border:1.5px solid var(--border);font-size:13.5px;
    font-weight:600;color:var(--text-dim);cursor:pointer;background:var(--card);}
  .equip-chip.on{border-color:var(--accent);color:var(--accent);background:#FFF1EC;}
  .seg{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .seg button{flex:1;padding:11px;border:none;background:var(--card);font-weight:700;font-size:14px;color:var(--text-dim);cursor:pointer;}
  .seg button.on{background:var(--accent);color:#fff;}
  .empty{text-align:center;color:var(--text-dim);font-size:14px;padding:28px 10px;}
  .divider{height:1px;background:var(--border);margin:18px 0;}
  .section-sub{font-size:12px;color:var(--text-dim);margin:0 0 10px;}
  .toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));
    background:var(--text);color:#fff;padding:12px 16px;border-radius:10px;font-size:14px;text-align:center;
    max-width:488px;margin:0 auto;z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.2);}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-root"></div>
<nav class="tabbar" id="tabbar">
  <button class="tab" data-action="set-tab" data-tab="today"><span class="tab-icon">●</span>Today</button>
  <button class="tab" data-action="set-tab" data-tab="history"><span class="tab-icon">▤</span>History</button>
  <button class="tab" data-action="set-tab" data-tab="settings"><span class="tab-icon">⚙</span>Settings</button>
</nav>

<script>
/* ---------- constants ---------- */
const STORAGE_KEY = 'lift_state_v1';
const EXDB_KEY = 'lift_exdb_v1';
const EXDB_TIME_KEY = 'lift_exdb_time_v1';
const EXDB_URL = 'https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json';
const EXDB_IMG_BASE = 'https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/';
const EXDB_MAX_AGE = 7 * 24 * 60 * 60 * 1000; // 1 week

const MUSCLES = ['Chest','Back','Legs','Shoulders','Biceps','Triceps','Core'];

const MUSCLE_MAP = {
  'chest':'Chest',
  'lats':'Back','middle back':'Back','lower back':'Back','traps':'Back',
  'quadriceps':'Legs','hamstrings':'Legs','calves':'Legs','glutes':'Legs','abductors':'Legs','adductors':'Legs',
  'shoulders':'Shoulders',
  'biceps':'Biceps','forearms':'Biceps',
  'triceps':'Triceps',
  'abdominals':'Core'
  // 'neck' intentionally excluded
};

const EQUIP_KEYS = ['body_only','dumbbell','machine','cable','barbell'];
const EQUIP_LABELS = {body_only:'Bodyweight',dumbbell:'Dumbbells',machine:'Machines',cable:'Cables',barbell:'Barbell'};
const EQUIP_DB_VALUE = {body_only:'body only',dumbbell:'dumbbell',machine:'machine',cable:'cable',barbell:'barbell'};

const GOAL_PARAMS = {
  strength:  {sets:4, restSec:150, repsTarget:5,  repsLabel:'4-6'},
  muscle:    {sets:3, restSec:90,  repsTarget:10, repsLabel:'8-12'},
  endurance: {sets:3, restSec:60,  repsTarget:17, repsLabel:'15-20'}
};
const SECS_PER_SET_WORK = 40; // rough time to actually perform one set, for budgeting

/* ---------- state ---------- */
function defaultState(){
  return {
    tab: 'today',
    unit: 'lb',
    gen: { location:'planet_fitness', goal:'muscle', minutes:45 },
    equipment: {
      planet_fitness: { body_only:true, dumbbell:true, machine:true, cable:true, barbell:false },
      home:            { body_only:true, dumbbell:true, machine:false, cable:false, barbell:false }
    },
    history: [],       // completed sessions
    activeWorkout: null, // in-progress workout, or null
    expanded: {}       // exerciseId -> bool, UI-only but persisted is fine
  };
}

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){ return defaultState(); }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ /* storage full/unavailable */ }
}

/* ---------- exercise db ---------- */
let exerciseDb = null;      // raw array from free-exercise-db, filtered to strength + mapped muscle
let exerciseDbLoading = null;

async function getExerciseDb(){
  if(exerciseDb) return exerciseDb;
  if(exerciseDbLoading) return exerciseDbLoading;
  exerciseDbLoading = (async () => {
    let raw = null;
    let cached = null;
    try{
      const c = localStorage.getItem(EXDB_KEY);
      const t = +(localStorage.getItem(EXDB_TIME_KEY) || 0);
      if(c && (Date.now() - t) < EXDB_MAX_AGE) cached = JSON.parse(c);
    }catch(e){}
    if(cached){ raw = cached; }
    else{
      try{
        const res = await fetch(EXDB_URL);
        raw = await res.json();
        try{
          localStorage.setItem(EXDB_KEY, JSON.stringify(raw));
          localStorage.setItem(EXDB_TIME_KEY, String(Date.now()));
        }catch(e){}
      }catch(e){
        try{
          const c2 = localStorage.getItem(EXDB_KEY);
          if(c2) raw = JSON.parse(c2);
        }catch(e2){}
      }
    }
    if(!raw) raw = [];
    exerciseDb = raw
      .filter(e => e.category === 'strength')
      .map(e => {
        const muscle = (e.primaryMuscles || []).map(m => MUSCLE_MAP[m]).find(Boolean);
        return muscle ? {
          id: e.id, name: e.name, muscle, equipment: e.equipment,
          images: (e.images||[]).map(i => EXDB_IMG_BASE + i),
          instructions: e.instructions || []
        } : null;
      })
      .filter(Boolean);
    return exerciseDb;
  })();
  return exerciseDbLoading;
}

function refreshExerciseDb(){
  try{ localStorage.removeItem(EXDB_KEY); localStorage.removeItem(EXDB_TIME_KEY); }catch(e){}
  exerciseDb = null; exerciseDbLoading = null;
  return getExerciseDb();
}

/* ---------- recovery ---------- */
function muscleRecovery(){
  const today = new Date(); today.setHours(0,0,0,0);
  const lastTrained = {};
  MUSCLES.forEach(m => lastTrained[m] = null);
  state.history.forEach(session => {
    const d = new Date(session.date); d.setHours(0,0,0,0);
    session.exercises.forEach(ex => {
      if(!lastTrained[ex.muscle] || d > lastTrained[ex.muscle]) lastTrained[ex.muscle] = d;
    });
  });
  return MUSCLES.map(m => {
    const d = lastTrained[m];
    if(!d) return {muscle:m, days:Infinity, status:'fresh'};
    const days = Math.round((today - d) / 86400000);
    let status = 'fresh';
    if(days <= 0) status = 'fatigued';
    else if(days === 1) status = 'recovering';
    return {muscle:m, days, status};
  });
}

/* ---------- unit conversion (display-only, never mutates stored values) ---------- */
function toDisplayWeight(amount, storedUnit, displayUnit){
  if(amount == null) return null;
  if(storedUnit === displayUnit) return round(amount, displayUnit);
  if(storedUnit === 'lb' && displayUnit === 'kg') return round(amount * 0.45359237, 'kg');
  if(storedUnit === 'kg' && displayUnit === 'lb') return round(amount / 0.45359237, 'lb');
  return round(amount, displayUnit);
}
function round(n, unit){
  if(unit === 'kg') return Math.round(n * 2) / 2; // nearest 0.5 kg
  return Math.round(n); // nearest 1 lb
}
function unitIncrement(unit){ return unit === 'kg' ? 2.5 : 5; }

/* ---------- progressive overload suggestion ---------- */
function suggestNextSet(exerciseName){
  for(let i = state.history.length - 1; i >= 0; i--){
    const ex = state.history[i].exercises.find(e => e.name === exerciseName);
    if(!ex || !ex.sets.length) continue;
    let topWeight = null, topUnit = state.unit;
    ex.sets.forEach(s => {
      if(s.weight == null) return;
      const inDisplay = toDisplayWeight(s.weight, s.unit, state.unit);
      if(topWeight == null || inDisplay > topWeight){ topWeight = inDisplay; topUnit = state.unit; }
    });
    if(topWeight == null) return {weight:null, hitAll:false};
    const hitAll = ex.sets.every(s => (s.doneReps||0) >= (s.targetReps||0));
    const weight = hitAll ? topWeight + unitIncrement(state.unit) : topWeight;
    return {weight: round(weight, state.unit), hitAll};
  }
  return {weight:null, hitAll:false};
}

/* ---------- workout generation ---------- */
async function generateWorkout(){
  const db = await getExerciseDb();
  const {location, goal, minutes} = state.gen;
  const allowed = new Set(
    EQUIP_KEYS.filter(k => state.equipment[location][k]).map(k => EQUIP_DB_VALUE[k])
  );
  const pool = db.filter(e => allowed.has(e.equipment));
  if(!pool.length){
    showToast("No exercises match this location's equipment settings. Check Settings.");
    return;
  }
  const params = GOAL_PARAMS[goal];
  const timePerExercise = params.sets * (params.restSec + SECS_PER_SET_WORK);
  let numExercises = Math.round((minutes * 60) / timePerExercise);
  numExercises = Math.max(3, Math.min(8, numExercises));

  const recovery = muscleRecovery();
  const order = [...recovery].sort((a,b) => {
    const ad = a.days === Infinity ? 9999 : a.days;
    const bd = b.days === Infinity ? 9999 : b.days;
    return bd - ad;
  }).map(r => r.muscle);

  const byMuscle = {};
  MUSCLES.forEach(m => byMuscle[m] = shuffle(pool.filter(e => e.muscle === m)));

  const chosen = [];
  const usedIds = new Set();
  let guard = 0;
  while(chosen.length < numExercises && guard < numExercises * 20){
    guard++;
    let placedAny = false;
    for(const muscle of order){
      if(chosen.length >= numExercises) break;
      const list = byMuscle[muscle] || [];
      const pick = list.find(e => !usedIds.has(e.id));
      if(pick){ chosen.push(pick); usedIds.add(pick.id); placedAny = true; }
    }
    if(!placedAny) break;
  }
  if(!chosen.length){
    showToast("Couldn't find enough matching exercises. Try different equipment or a gym mode.");
    return;
  }

  state.activeWorkout = {
    date: new Date().toISOString(),
    location, goal, minutes,
    exercises: chosen.map(e => buildExerciseEntry(e, params)),
    rest: null // {endAt, forExIdx, forSetIdx} or null
  };
  state.expanded = {};
  saveState();
  render();
}

function buildExerciseEntry(ex, params){
  const suggestion = suggestNextSet(ex.name);
  const sets = [];
  for(let i = 0; i < params.sets; i++){
    sets.push({
      weight: suggestion.weight,
      unit: state.unit,
      targetReps: params.repsTarget,
      doneReps: null,
      done: false
    });
  }
  return {
    id: ex.id, name: ex.name, muscle: ex.muscle, equipment: ex.equipment,
    images: ex.images, instructions: ex.instructions,
    repsLabel: params.repsLabel, sets
  };
}

async function swapExercise(exIdx){
  const db = await getExerciseDb();
  const w = state.activeWorkout;
  const current = w.exercises[exIdx];
  const {location} = w;
  const allowed = new Set(EQUIP_KEYS.filter(k => state.equipment[location][k]).map(k => EQUIP_DB_VALUE[k]));
  const usedIds = new Set(w.exercises.map(e => e.id));
  const candidates = shuffle(db.filter(e => e.muscle === current.muscle && allowed.has(e.equipment) && !usedIds.has(e.id)));
  if(!candidates.length){ showToast('No other exercise available for this muscle group.'); return; }
  const params = GOAL_PARAMS[w.goal];
  w.exercises[exIdx] = buildExerciseEntry(candidates[0], params);
  saveState();
  render();
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- logging a set ---------- */
let audioCtx = null;
function unlockAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
}
function beep(){
  try{
    if(!audioCtx) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.42);
  }catch(e){}
}
function tryVibrate(pattern){
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
}

function toggleSetDone(exIdx, setIdx){
  unlockAudio();
  const w = state.activeWorkout;
  const ex = w.exercises[exIdx];
  const set = ex.sets[setIdx];
  set.done = !set.done;
  if(set.done){
    if(set.doneReps == null) set.doneReps = set.targetReps;
    const isLastSetOfLastExercise = exIdx === w.exercises.length - 1 && setIdx === ex.sets.length - 1;
    if(!isLastSetOfLastExercise){
      const restSec = GOAL_PARAMS[w.goal].restSec;
      w.rest = { endAt: Date.now() + restSec * 1000, total: restSec };
    }
  } else {
    w.rest = null;
  }
  saveState();
  render();
}

function finishWorkout(){
  const w = state.activeWorkout;
  const loggedExercises = w.exercises
    .map(ex => ({
      name: ex.name, muscle: ex.muscle,
      sets: ex.sets.filter(s => s.done).map(s => ({weight: s.weight, unit: s.unit, targetReps: s.targetReps, doneReps: s.doneReps}))
    }))
    .filter(ex => ex.sets.length);
  if(loggedExercises.length){
    state.history.push({
      date: w.date, location: w.location, goal: w.goal, minutes: w.minutes,
      exercises: loggedExercises
    });
  }
  state.activeWorkout = null;
  saveState();
  render();
  showToast(loggedExercises.length ? 'Workout saved.' : 'Workout discarded (nothing logged).');
}

function discardWorkout(){
  state.activeWorkout = null;
  saveState();
  render();
}

function skipRest(){
  if(state.activeWorkout){ state.activeWorkout.rest = null; saveState(); render(); }
}

/* ---------- rest timer ticking (doesn't trigger full re-render each tick) ---------- */
let restTickHandle = null;
function startRestTicker(){
  stopRestTicker();
  restTickHandle = setInterval(() => {
    const w = state.activeWorkout;
    if(!w || !w.rest){ stopRestTicker(); return; }
    const remainingMs = w.rest.endAt - Date.now();
    const el = document.getElementById('rest-time');
    if(!el){ return; }
    if(remainingMs <= 0){
      el.textContent = "0:00";
      w.rest = null;
      saveState();
      beep(); tryVibrate([200,80,200]);
      document.title = 'Lift — rest over';
      setTimeout(() => { document.title = 'Lift'; }, 4000);
      render();
      return;
    }
    const s = Math.ceil(remainingMs / 1000);
    el.textContent = Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
  }, 250);
}
function stopRestTicker(){ if(restTickHandle){ clearInterval(restTickHandle); restTickHandle = null; } }

/* ---------- toast ---------- */
let toastHandle = null;
function showToast(msg){
  const root = document.getElementById('toast-root');
  clearTimeout(toastHandle);
  root.innerHTML = '<div class="toast">' + escapeHtml(msg) + '</div>';
  toastHandle = setTimeout(() => { root.innerHTML = ''; }, 3200);
}

/* ---------- rendering ---------- */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'});
}

function render(){
  const app = document.getElementById('app');
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === state.tab));
  if(state.tab === 'today') app.innerHTML = renderToday();
  else if(state.tab === 'history') app.innerHTML = renderHistory();
  else app.innerHTML = renderSettings();
  if(state.activeWorkout && state.activeWorkout.rest) startRestTicker();
  else stopRestTicker();
}

function renderToday(){
  const w = state.activeWorkout;
  if(w) return renderActiveWorkout(w);

  const recovery = muscleRecovery();
  const pills = recovery.map(r => {
    const label = r.days === Infinity ? 'fresh' : (r.status === 'fatigued' ? 'today' : r.status === 'recovering' ? '1 day' : r.days + 'd fresh');
    return `<span class="pill ${r.status}">${r.muscle} · ${label}</span>`;
  }).join('');

  return `
    <h1 class="screen-title">Today</h1>
    <div class="card">
      <div class="card-label">Muscle recovery</div>
      <div class="pill-row">${pills}</div>
    </div>
    <div class="card">
      <div class="field">
        <label>Where</label>
        <div class="select-wrap">
          <select id="gen-location">
            <option value="planet_fitness" ${state.gen.location==='planet_fitness'?'selected':''}>Planet Fitness</option>
            <option value="home" ${state.gen.location==='home'?'selected':''}>Home</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Goal</label>
        <div class="select-wrap">
          <select id="gen-goal">
            <option value="strength" ${state.gen.goal==='strength'?'selected':''}>strength</option>
            <option value="muscle" ${state.gen.goal==='muscle'?'selected':''}>muscle</option>
            <option value="endurance" ${state.gen.goal==='endurance'?'selected':''}>endurance</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Minutes</label>
        <div class="select-wrap">
          <select id="gen-minutes">
            ${[30,45,60,75].map(m => `<option value="${m}" ${state.gen.minutes===m?'selected':''}>${m}</option>`).join('')}
          </select>
        </div>
      </div>
      <button class="btn btn-primary" data-action="generate" style="margin-top:4px;">Generate workout</button>
    </div>
  `;
}

function renderActiveWorkout(w){
  const restHtml = w.rest ? `
    <div class="rest-banner">
      <div><div style="font-size:12px;opacity:.75;">Resting</div><div class="time" id="rest-time">--:--</div></div>
      <button class="skip" data-action="skip-rest">Skip</button>
    </div>` : '';

  const allDone = w.exercises.every(ex => ex.sets.every(s => s.done));
  const anyDone = w.exercises.some(ex => ex.sets.some(s => s.done));

  const exercisesHtml = w.exercises.map((ex, exIdx) => {
    const expanded = !!state.expanded[ex.id + '_' + exIdx];
    const setsHtml = ex.sets.map((s, setIdx) => {
      const dispWeight = s.weight == null ? '' : toDisplayWeight(s.weight, s.unit, state.unit);
      return `
      <div class="set-row ${s.done?'done':''}">
        <div class="set-num">${setIdx+1}</div>
        <input type="number" inputmode="decimal" placeholder="${state.unit}"
          value="${dispWeight}" ${s.done?'disabled':''}
          data-role="weight" data-ex="${exIdx}" data-set="${setIdx}">
        <input type="number" inputmode="numeric" placeholder="${ex.repsLabel}"
          value="${s.doneReps==null?'':s.doneReps}" ${s.done?'disabled':''}
          data-role="reps" data-ex="${exIdx}" data-set="${setIdx}">
        <button class="check ${s.done?'on':''}" data-action="complete-set" data-ex="${exIdx}" data-set="${setIdx}">✓</button>
      </div>`;
    }).join('');

    const detailHtml = expanded ? `
      <div class="ex-detail">
        ${ex.images[0] ? `<img src="${ex.images[0]}" loading="lazy" alt="${escapeHtml(ex.name)}" onerror="this.style.display='none'">` : ''}
        <ol>${ex.instructions.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ol>
        <a class="watch-link" target="_blank" rel="noopener"
          href="https://www.youtube.com/results?search_query=${encodeURIComponent(ex.name + ' exercise form')}">Watch form ↗</a>
      </div>` : '';

    return `
      <div class="ex-card">
        <div class="ex-header">
          <div>
            <p class="ex-name">${escapeHtml(ex.name)}</p>
            <div class="ex-meta">${ex.muscle} · target ${ex.repsLabel} reps</div>
          </div>
          <div class="ex-actions">
            <button class="icon-btn" data-action="toggle-expand" data-ex="${exIdx}" data-exid="${ex.id}" title="Details">${expanded?'▲':'ⓘ'}</button>
            <button class="icon-btn" data-action="swap-exercise" data-ex="${exIdx}" title="Swap">⇄</button>
          </div>
        </div>
        <div class="sets-table">${setsHtml}</div>
        ${detailHtml}
      </div>`;
  }).join('');

  return `
    <h1 class="screen-title">Workout</h1>
    ${restHtml}
    <div class="section-sub">${locationLabel(w.location)} · ${w.goal} · ~${w.minutes} min</div>
    ${exercisesHtml}
    <button class="btn btn-primary" data-action="finish-workout" ${anyDone?'':'disabled'}>
      ${allDone ? 'Finish workout' : 'Finish workout'}
    </button>
    <button class="btn-danger-ghost" data-action="discard-workout" style="display:block;width:100%;margin-top:8px;">
      Discard workout
    </button>
  `;
}

function locationLabel(loc){ return loc === 'home' ? 'Home' : 'Planet Fitness'; }

function renderHistory(){
  if(!state.history.length){
    return `<h1 class="screen-title">History</h1><div class="empty">No workouts logged yet. Finish a workout on the Today tab and it'll show up here.</div>`;
  }
  const sessions = state.history.slice().reverse();
  const sessionsHtml = sessions.map((s, i) => {
    const realIdx = state.history.length - 1 - i;
    const expanded = !!state.expanded['hist_' + realIdx];
    const topLines = s.exercises.map(ex => {
      const top = topSetOf(ex);
      const w = top ? toDisplayWeight(top.weight, top.unit, state.unit) : null;
      return `<div><span>${escapeHtml(ex.name)}</span><span class="muted">${w!=null?(w+' '+state.unit+' × '+top.doneReps):'—'}</span></div>`;
    }).join('');
    return `
      <div class="history-item">
        <div class="row">
          <div>
            <div class="date">${fmtDate(s.date)}</div>
            <div class="sub">${locationLabel(s.location)} · ${s.goal} · ${s.exercises.length} exercises</div>
          </div>
          <button class="icon-btn" data-action="toggle-hist" data-hist="${realIdx}">${expanded?'▲':'▾'}</button>
        </div>
        ${expanded ? `<div class="history-detail">${topLines}</div>` : ''}
      </div>`;
  }).join('');

  const charts = renderProgressCharts();

  return `
    <h1 class="screen-title">History</h1>
    ${charts}
    <div class="divider"></div>
    ${sessionsHtml}
  `;
}

function topSetOf(ex){
  let top = null;
  ex.sets.forEach(s => {
    if(s.weight == null) return;
    if(!top || s.weight > top.weight) top = s;
  });
  return top;
}

function renderProgressCharts(){
  const byName = {};
  state.history.forEach(session => {
    session.exercises.forEach(ex => {
      const top = topSetOf(ex);
      if(!top) return;
      (byName[ex.name] = byName[ex.name] || []).push({date: session.date, weight: toDisplayWeight(top.weight, top.unit, state.unit)});
    });
  });
  const entries = Object.entries(byName).filter(([,pts]) => pts.length >= 2);
  if(!entries.length) return '';
  const cards = entries.map(([name, pts]) => {
    const w = 280, h = 64, pad = 6;
    const vals = pts.map(p => p.weight);
    const min = Math.min(...vals), max = Math.max(...vals);
    const span = (max - min) || 1;
    const stepX = (w - pad*2) / Math.max(1, pts.length - 1);
    const coords = pts.map((p,i) => {
      const x = pad + i*stepX;
      const y = h - pad - ((p.weight - min) / span) * (h - pad*2);
      return [x,y];
    });
    const path = coords.map((c,i) => (i===0?'M':'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
    const dots = coords.map(c => `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="2.5" fill="#FF5A36"/>`).join('');
    const last = pts[pts.length-1].weight;
    return `
      <div class="chart-card">
        <div class="ch-title">${escapeHtml(name)}</div>
        <div class="ch-sub">Top set · ${pts.length} sessions · latest ${last} ${state.unit}</div>
        <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
          <path d="${path}" fill="none" stroke="#FF5A36" stroke-width="2"/>
          ${dots}
        </svg>
      </div>`;
  }).join('');
  return `<div class="card-label" style="margin:4px 2px 10px;">Progress</div>${cards}`;
}

function renderSettings(){
  const equipChips = (loc) => EQUIP_KEYS.map(k => {
    const on = state.equipment[loc][k];
    return `<button class="equip-chip ${on?'on':''}" data-action="toggle-equipment" data-loc="${loc}" data-equip="${k}">${EQUIP_LABELS[k]}</button>`;
  }).join('');

  return `
    <h1 class="screen-title">Settings</h1>
    <div class="card">
      <div class="card-label">Units</div>
      <div class="seg">
        <button class="${state.unit==='lb'?'on':''}" data-action="set-unit" data-unit="lb">lb</button>
        <button class="${state.unit==='kg'?'on':''}" data-action="set-unit" data-unit="kg">kg</button>
      </div>
      <p class="section-sub" style="margin-top:10px;">
        Switching only changes how weights are displayed. Each logged set keeps the unit you entered it in,
        so toggling back and forth never rounds your history.
      </p>
    </div>
    <div class="card">
      <div class="card-label">Planet Fitness equipment</div>
      <div class="equip-grid">${equipChips('planet_fitness')}</div>
    </div>
    <div class="card">
      <div class="card-label">Home equipment</div>
      <div class="equip-grid">${equipChips('home')}</div>
    </div>
    <div class="card">
      <div class="card-label">Data</div>
      <button class="btn btn-secondary" data-action="refresh-exdb">Refresh exercise library</button>
      <button class="btn-danger-ghost" data-action="reset-history" style="display:block;width:100%;margin-top:10px;text-align:center;">
        Clear workout history
      </button>
    </div>
    <p class="section-sub" style="text-align:center;">All data stays on this phone's local storage. Nothing is sent anywhere.</p>
  `;
}

/* ---------- event delegation ---------- */
document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;

  if(action === 'set-tab'){
    state.tab = btn.dataset.tab; saveState(); render();
  } else if(action === 'generate'){
    const locSel = document.getElementById('gen-location');
    const goalSel = document.getElementById('gen-goal');
    const minSel = document.getElementById('gen-minutes');
    state.gen.location = locSel.value;
    state.gen.goal = goalSel.value;
    state.gen.minutes = +minSel.value;
    saveState();
    btn.disabled = true; btn.textContent = 'Generating…';
    await generateWorkout();
  } else if(action === 'complete-set'){
    toggleSetDone(+btn.dataset.ex, +btn.dataset.set);
  } else if(action === 'swap-exercise'){
    await swapExercise(+btn.dataset.ex);
  } else if(action === 'toggle-expand'){
    const key = btn.dataset.exid + '_' + btn.dataset.ex;
    state.expanded[key] = !state.expanded[key];
    saveState(); render();
  } else if(action === 'finish-workout'){
    finishWorkout();
  } else if(action === 'discard-workout'){
    if(confirm('Discard this workout? Anything logged so far will be lost.')) discardWorkout();
  } else if(action === 'skip-rest'){
    skipRest();
  } else if(action === 'toggle-hist'){
    const key = 'hist_' + btn.dataset.hist;
    state.expanded[key] = !state.expanded[key];
    saveState(); render();
  } else if(action === 'toggle-equipment'){
    const loc = btn.dataset.loc, eq = btn.dataset.equip;
    state.equipment[loc][eq] = !state.equipment[loc][eq];
    saveState(); render();
  } else if(action === 'set-unit'){
    state.unit = btn.dataset.unit; saveState(); render();
  } else if(action === 'refresh-exdb'){
    btn.disabled = true; btn.textContent = 'Refreshing…';
    await refreshExerciseDb();
    btn.disabled = false; btn.textContent = 'Refresh exercise library';
    showToast('Exercise library refreshed.');
  } else if(action === 'reset-history'){
    if(confirm('Delete all logged workout history? This cannot be undone.')){
      state.history = []; saveState(); render();
    }
  }
});

document.addEventListener('input', (e) => {
  const t = e.target;
  if(t.dataset && t.dataset.role === 'weight'){
    const w = state.activeWorkout; if(!w) return;
    const ex = w.exercises[+t.dataset.ex]; const set = ex.sets[+t.dataset.set];
    const val = t.value === '' ? null : parseFloat(t.value);
    set.weight = val; set.unit = state.unit;
    saveState();
  } else if(t.dataset && t.dataset.role === 'reps'){
    const w = state.activeWorkout; if(!w) return;
    const ex = w.exercises[+t.dataset.ex]; const set = ex.sets[+t.dataset.set];
    set.doneReps = t.value === '' ? null : parseInt(t.value, 10);
    saveState();
  }
});

/* ---------- boot ---------- */
render();
getExerciseDb(); // warm the cache early

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
